<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Flipper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #111; color: #0f0; padding: 16px; }
  h1 { color: #0f0; margin-bottom: 16px; font-size: 1.2rem; }
  .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 6px 14px; background: #222; border: 1px solid #0f0; color: #0f0;
         cursor: pointer; border-radius: 4px; font-family: monospace; }
  .tab.active { background: #0f0; color: #111; }
  .panel { display: none; }
  .panel.active { display: block; }
  textarea { width: 100%; height: 180px; background: #1a1a1a; color: #0f0;
             border: 1px solid #0f0; padding: 8px; font-family: monospace;
             font-size: 0.9rem; border-radius: 4px; resize: vertical; }
  button { margin-top: 10px; padding: 10px 20px; background: #0f0; color: #111;
           border: none; font-family: monospace; font-size: 1rem;
           cursor: pointer; border-radius: 4px; width: 100%; }
  button:active { opacity: 0.8; }
  #status { margin-top: 10px; padding: 8px; border: 1px solid #333;
            border-radius: 4px; min-height: 36px; color: #8f8; font-size: 0.85rem; }
  label { display: block; margin-bottom: 6px; color: #8f8; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>&#9660; ESP32 Flipper</h1>

<div class="tab-bar">
  <button class="tab active" onclick="switchTab('script')">Script</button>
  <button class="tab" onclick="switchTab('ota')">OTA Upload</button>
</div>

<!-- Script Runner -->
<div id="tab-script" class="panel active">
  <label>Script (one command per line):</label>
  <textarea id="scriptBox" placeholder="PRINT Hello World&#10;DELAY 1000&#10;LED ON&#10;DELAY 500&#10;LED OFF&#10;GPIO 2 HIGH"></textarea>
  <button onclick="sendScript()">Send &amp; Run</button>
  <div id="status">Ready.</div>
</div>

<!-- OTA Code Upload -->
<div id="tab-ota" class="panel">
  <label>Paste Arduino/C++ code snippet to upload:</label>
  <textarea id="otaBox" placeholder="void myFunc() {&#10;  digitalWrite(2, HIGH);&#10;}"></textarea>
  <button onclick="sendOTA()">Upload to Device</button>
  <div id="otaStatus">Ready.</div>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab, .panel').forEach(el => el.classList.remove('active'));
  document.querySelector('#tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

async function sendScript() {
  const script = document.getElementById('scriptBox').value.trim();
  const status = document.getElementById('status');
  if (!script) { status.textContent = 'Nothing to send.'; return; }
  status.textContent = 'Sending...';
  try {
    const r = await fetch('/run', { method: 'POST', body: script,
                                    headers: {'Content-Type': 'text/plain'} });
    const j = await r.json();
    status.textContent = j.ok ? 'Script sent! Watch your device.' : 'Error from device.';
  } catch(e) { status.textContent = 'Error: ' + e.message; }
}

async function sendOTA() {
  const code = document.getElementById('otaBox').value.trim();
  const status = document.getElementById('otaStatus');
  if (!code) { status.textContent = 'Nothing to upload.'; return; }
  status.textContent = 'Uploading...';
  try {
    const r = await fetch('/upload', { method: 'POST', body: code,
                                       headers: {'Content-Type': 'text/plain'} });
    const j = await r.json();
    status.textContent = j.ok ? 'Code received by device!' : 'Error.';
  } catch(e) { status.textContent = 'Error: ' + e.message; }
}
</script>
</body>
</html>
